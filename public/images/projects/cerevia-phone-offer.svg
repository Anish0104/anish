<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <!-- Background backdrop -->
  <rect width="1000" height="620" rx="16" fill="#09090b"/>

  <!-- Left: Explanatory Voice Loop Specs -->
  <g transform="translate(60, 100)">
    <rect width="420" height="420" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="24" y="24" width="160" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="104" y="42" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">ELEVENLABS VOICE LOOP</text>
    
    <text x="24" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="20">Autonomous Off-Shift Dispatch</text>
    <text x="24" y="112" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" leading="1.6">When Clinical Lead approves Offer #108, Cerevia initiates an automated voice call &amp; push notification simultaneously to Dr. Miller's mobile app.</text>

    <!-- Voice Transcript card -->
    <g transform="translate(24, 150)">
      <rect width="372" height="136" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <!-- Audio Waveform -->
      <path d="M 20 30 L 30 30 M 35 20 L 35 40 M 42 12 L 42 48 M 49 24 L 49 36 M 56 16 L 56 44 M 63 26 L 63 34 M 70 8 L 70 52 M 77 22 L 77 38 M 84 18 L 84 42 M 91 28 L 91 32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text x="110" y="34" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">ElevenLabs Neural Voice Engine</text>

      <text x="20" y="70" fill="#e4e4e7" font-family="system-ui, sans-serif" font-style="italic" font-size="13">"Dr. Miller, this is Cerevia for Sevaro. Suncrest Hospital has an urgent stroke surge. 2 hours needed: 19:00 to 21:00. Press 1 or tap app to accept."</text>
      <text x="20" y="114" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">✓ Zero patient PII exposed (Privacy-by-Design)</text>
    </g>

    <!-- Rule Check verification -->
    <g transform="translate(24, 305)">
      <text x="0" y="20" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13">✓ 10-Minute Timeout Fallback (Auto-escalation)</text>
      <text x="0" y="46" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13">✓ Duplicate Accept Protection ("Already Filled")</text>
      <text x="0" y="72" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13">✓ Shift Equalization (Limits doctor to short hospital)</text>
    </g>
  </g>

  <!-- Right: Physician Mobile Screen (Flutter App Mock) -->
  <g transform="translate(560, 50)">
    <!-- Smartphone Chassis -->
    <rect width="320" height="520" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="12" y="12" width="296" height="496" rx="28" fill="#09090b"/>
    
    <!-- Phone Notch / Dynamic Island -->
    <rect x="100" y="20" width="120" height="24" rx="12" fill="#18181b"/>
    <circle cx="200" cy="32" r="4" fill="#0284c7"/>

    <!-- App Top Bar -->
    <text x="32" y="76" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">SEVARO PHYSICIAN APP</text>
    <text x="32" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="18">Incoming Coverage Offer</text>

    <!-- Pulsing Alert Badge -->
    <g transform="translate(32, 126)">
      <rect width="256" height="34" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#ef4444"/>
      <text x="34" y="21" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="600" font-size="12">STROKE COVERAGE GAP · HIGH PRIORITY</text>
    </g>

    <!-- Offer Details Card -->
    <g transform="translate(32, 176)">
      <rect width="256" height="196" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      
      <text x="18" y="32" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">FACILITY</text>
      <text x="18" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Suncrest Hospital</text>
      <text x="18" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Your credential is active ✓</text>

      <path d="M 18 80 L 238 80" stroke="#27272a" stroke-width="1"/>

      <text x="18" y="104" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">SHIFT DURATION</text>
      <text x="18" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">2 Hours (19:00 – 21:00 EST)</text>
      <text x="18" y="140" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">Complies with 10h rest &amp; 60h cap ✓</text>

      <path d="M 18 152 L 238 152" stroke="#27272a" stroke-width="1"/>
      
      <text x="18" y="174" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">Expires in 08:42 min</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(32, 390)">
      <!-- Accept Button -->
      <rect width="256" height="48" rx="8" fill="#0284c7"/>
      <text x="128" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Accept &amp; Go Online ✓</text>

      <!-- Decline Button -->
      <rect y="58" width="256" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <text x="128" y="474" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Decline Offer</text>
    </g>
  </g>
</svg>

