<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser/Window frame -->
  <rect width="1000" height="620" rx="16" fill="#18181b"/>
  
  <!-- Window title bar -->
  <rect width="1000" height="42" rx="16" fill="#27272a"/>
  <rect y="26" width="1000" height="16" fill="#27272a"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="500" y="25" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">cerevia.health/command · Sevaro Teleneurology Command Center</text>

  <!-- Main Dashboard Surface -->
  <rect x="0" y="42" width="1000" height="578" fill="#09090b"/>

  <!-- Top App Navigation -->
  <rect x="0" y="42" width="1000" height="56" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="32" y="77" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="18">CEREVIA</text>
  <text x="120" y="77" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Teleneurology Operations</text>
  
  <!-- Tabs -->
  <rect x="340" y="54" width="130" height="32" rx="6" fill="#0284c7" fill-opacity="0.2"/>
  <text x="405" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Live Command</text>
  <text x="530" y="75" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Approvals (1)</text>
  <text x="640" y="75" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Physicians (8)</text>
  <text x="750" y="75" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Audit Logs</text>

  <!-- Live Pulse Pill -->
  <rect x="860" y="56" width="108" height="28" rx="14" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <circle cx="876" cy="70" r="4" fill="#22c55e"/>
  <text x="888" y="74" fill="#86efac" font-family="ui-monospace, monospace" font-size="11">REPLAY: 18:20</text>

  <!-- CRITICAL FORECAST ALERT BANNER (Suncrest Surge) -->
  <rect x="32" y="118" width="936" height="68" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="64" cy="152" r="14" fill="#dc2626"/>
  <text x="64" y="157" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">!</text>
  <text x="96" y="145" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="700" font-size="14">PROJECTED COVERAGE COLLAPSE IN 40 MIN · SUNCREST HOSPITAL</text>
  <text x="96" y="165" fill="#fecaca" font-family="system-ui, sans-serif" font-size="13">Surge detected (5 consults vs p90 normal of 1) + 2 neurologists ending shifts at 19:00. Unmet stroke demand projected by 19:15.</text>
  <rect x="830" y="132" width="120" height="40" rx="6" fill="#dc2626"/>
  <text x="890" y="157" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">View Offer Fix →</text>

  <!-- METRICS ROW -->
  <!-- Card 1: Active Consults -->
  <g transform="translate(32, 206)">
    <rect width="218" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">ACTIVE STROKE CONSULTS</text>
    <text x="20" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="28">18</text>
    <text x="64" y="68" fill="#ef4444" font-family="ui-monospace, monospace" font-size="12">4 past critical</text>
  </g>
  <!-- Card 2: On-Duty Neurologists -->
  <g transform="translate(270, 206)">
    <rect width="218" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">ON-DUTY PHYSICIANS</text>
    <text x="20" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="28">8</text>
    <text x="46" y="68" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12">2 leaving at 19:00</text>
  </g>
  <!-- Card 3: Eligible Off-Duty -->
  <g transform="translate(508, 206)">
    <rect width="218" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">OFF-DUTY POOL</text>
    <text x="20" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="28">6</text>
    <text x="46" y="68" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12">1 passes all 8 rules</text>
  </g>
  <!-- Card 4: Forecast Horizon -->
  <g transform="translate(746, 206)">
    <rect width="222" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">FORECAST HORIZON</text>
    <text x="20" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="28">90 min</text>
    <text x="135" y="68" fill="#22c55e" font-family="ui-monospace, monospace" font-size="12">deterministic</text>
  </g>

  <!-- RANKED ATTENTION QUEUE -->
  <g transform="translate(32, 322)">
    <rect width="936" height="268" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <!-- Table Header -->
    <rect width="936" height="38" rx="10" fill="#27272a"/>
    <rect y="22" width="936" height="16" fill="#27272a"/>
    <text x="24" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SEVERITY</text>
    <text x="110" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HOSPITAL</text>
    <text x="260" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WHAT'S WRONG</text>
    <text x="560" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RECOMMENDED ACTION</text>
    <text x="820" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">APPROVER</text>

    <!-- Row 1 (Critical) -->
    <rect y="38" width="936" height="56" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
    <rect x="24" y="52" width="62" height="22" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="55" y="67" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CRITICAL</text>
    <text x="110" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Suncrest Hospital</text>
    <text x="260" y="70" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Coverage gap at 19:00 (Dr. Patel &amp; Dr. Lin end shifts)</text>
    <text x="560" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Dispatch 2hr offer to Dr. Miller (passes 8 rules)</text>
    <text x="820" y="70" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Clinical Lead</text>

    <!-- Row 2 (Critical) -->
    <rect y="94" width="936" height="56" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
    <rect x="24" y="108" width="62" height="22" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="55" y="123" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CRITICAL</text>
    <text x="110" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Mercy General</text>
    <text x="260" y="126" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Unassigned stroke consult past 10-min critical limit</text>
    <text x="560" y="126" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Reassign to Dr. Torres (camera online, idle)</text>
    <text x="820" y="126" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Coordinator</text>

    <!-- Row 3 (Warning) -->
    <rect y="150" width="936" height="56" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
    <rect x="24" y="164" width="62" height="22" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="55" y="179" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">WARNING</text>
    <text x="110" y="182" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">St. Jude Medical</text>
    <text x="260" y="182" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">CT Scans completed 14 min ago; no video link opened</text>
    <text x="560" y="182" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Ping assigned doctor helper app</text>
    <text x="820" y="182" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Coordinator</text>

    <!-- Row 4 (Info) -->
    <rect y="206" width="936" height="56" fill="#18181b"/>
    <rect x="24" y="220" width="62" height="22" rx="4" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
    <text x="55" y="235" fill="#99f6e4" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">INFO</text>
    <text x="110" y="238" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Valley Health</text>
    <text x="260" y="238" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Helper app heartbeat silence detected (2 min)</text>
    <text x="560" y="238" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Flagged for connection diagnostic</text>
    <text x="820" y="238" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Automated</text>
  </g>
</svg>
