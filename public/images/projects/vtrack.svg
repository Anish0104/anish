<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Warm cream sketchbook background -->
  <rect width="800" height="500" fill="#faf7f0"/>

  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Curved Sweeping Road (Top-down perspective with playful wobbly curves) -->
    <!-- Road edges -->
    <path d="M 40 430 C 180 430, 260 270, 420 250 C 580 230, 680 120, 760 70" stroke="#18181b" stroke-width="6"/>
    <path d="M 120 480 C 260 480, 340 330, 500 310 C 660 290, 740 180, 800 130" stroke="#18181b" stroke-width="6"/>

    <!-- Road Surface tint & Dashed Center Divider Line in Olive Green -->
    <path d="M 80 455 C 220 455, 300 300, 460 280 C 620 260, 710 150, 780 100" stroke="#4e7e2c" stroke-width="5" stroke-dasharray="18 16"/>

    <!-- Small Roadside Camera on Pole (Top-left near curve, emitting tracking scan cone) -->
    <g transform="translate(240, 100)">
      <!-- Ground mount base -->
      <path d="M 30 180 L 70 180" stroke="#18181b" stroke-width="5"/>
      <!-- Tall pole -->
      <path d="M 50 180 L 50 35" stroke="#18181b" stroke-width="6"/>

      <!-- Camera mount bracket -->
      <path d="M 50 45 L 85 45" stroke="#18181b" stroke-width="5"/>

      <!-- CCTV Camera body tilted down at the road (Olive green body) -->
      <g transform="translate(85, 45) rotate(28)">
        <polygon points="0,-12 48,-15 48,15 0,12" fill="#4e7e2c" stroke="#18181b" stroke-width="5"/>
        <!-- Sunshield hood -->
        <path d="M -5 -16 L 55 -20" stroke="#18181b" stroke-width="4"/>
        <!-- Camera Lens eye -->
        <ellipse cx="48" cy="0" rx="4" ry="10" fill="#ffffff" stroke="#18181b" stroke-width="4"/>
        <circle cx="50" cy="0" r="3" fill="#4e7e2c" stroke="none"/>
        <!-- Blinking status LED in white/olive -->
        <circle cx="15" cy="-8" r="3.5" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
      </g>

      <!-- Vision tracking detection cone scanning toward cars (Olive green rays) -->
      <path d="M 120 70 L 220 180 M 125 80 L 290 220" stroke="#4e7e2c" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
    </g>

    <!-- CAR 1: Lead Car (Top right, cruising fast) -->
    <g transform="translate(620, 150) rotate(-35)">
      <!-- Dotted motion trail behind car -->
      <path d="M -60 0 C -40 0, -20 0, -5 0" stroke="#4e7e2c" stroke-width="4" stroke-dasharray="7 6"/>
      <!-- Little exhaust puff -->
      <ellipse cx="-22" cy="-6" rx="5" ry="4" stroke="#4e7e2c" stroke-width="2.5"/>

      <!-- Charming top-down car doodle -->
      <!-- Wheels on sides -->
      <rect x="5" y="-22" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="5" y="15" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="50" y="-22" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="50" y="15" width="16" height="7" rx="3" fill="#18181b"/>

      <!-- Car body -->
      <rect x="0" y="-18" width="72" height="36" rx="14" fill="#ffffff" stroke="#18181b" stroke-width="5"/>
      <!-- Windshield front & rear -->
      <path d="M 48 -14 C 52 -5, 52 5, 48 14" stroke="#18181b" stroke-width="4"/>
      <path d="M 18 -14 C 15 -5, 15 5, 18 14" stroke="#18181b" stroke-width="4"/>
      <!-- Roof panel in olive green -->
      <rect x="22" y="-12" width="22" height="24" rx="4" fill="#4e7e2c" stroke="#18181b" stroke-width="3.5"/>

      <!-- Prominent Olive Green Tracking Bounding Box with Corner Reticles -->
      <g transform="translate(-10, -30)">
        <rect x="0" y="0" width="92" height="60" rx="6" stroke="#4e7e2c" stroke-width="4" stroke-dasharray="10 8" fill="#eef7e6" fill-opacity="0.3"/>
        <!-- Corner brackets in bold olive green -->
        <path d="M 0 14 L 0 0 L 14 0 M 78 0 L 92 0 L 92 14 M 0 46 L 0 60 L 14 60 M 78 60 L 92 60 L 92 46" stroke="#4e7e2c" stroke-width="5"/>
        <!-- Target tracking dot at center top -->
        <circle cx="46" cy="-6" r="4.5" fill="#4e7e2c" stroke="none"/>
      </g>
    </g>

    <!-- CAR 2: Middle Car (Center curve, turning) -->
    <g transform="translate(420, 270) rotate(-12)">
      <!-- Dotted motion trail -->
      <path d="M -65 0 C -45 0, -25 0, -5 0" stroke="#4e7e2c" stroke-width="4" stroke-dasharray="7 6"/>
      <ellipse cx="-20" cy="8" rx="6" ry="5" stroke="#4e7e2c" stroke-width="2.5"/>

      <!-- Wheels -->
      <rect x="5" y="-23" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="5" y="16" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="52" y="-23" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="52" y="16" width="16" height="7" rx="3" fill="#18181b"/>

      <!-- Car body -->
      <rect x="0" y="-19" width="76" height="38" rx="14" fill="#ffffff" stroke="#18181b" stroke-width="5"/>
      <path d="M 52 -15 C 56 -5, 56 5, 52 15" stroke="#18181b" stroke-width="4"/>
      <path d="M 18 -15 C 15 -5, 15 5, 18 15" stroke="#18181b" stroke-width="4"/>
      <rect x="23" y="-13" width="24" height="26" rx="4" fill="#4e7e2c" stroke="#18181b" stroke-width="3.5"/>

      <!-- Tracking Bounding Box -->
      <g transform="translate(-10, -32)">
        <rect x="0" y="0" width="96" height="64" rx="6" stroke="#4e7e2c" stroke-width="4" stroke-dasharray="10 8" fill="#eef7e6" fill-opacity="0.3"/>
        <path d="M 0 14 L 0 0 L 14 0 M 82 0 L 96 0 L 96 14 M 0 50 L 0 64 L 14 64 M 82 64 L 96 64 L 96 50" stroke="#4e7e2c" stroke-width="5"/>
        <circle cx="48" cy="-6" r="4.5" fill="#4e7e2c" stroke="none"/>
      </g>
    </g>

    <!-- CAR 3: Entry Car (Bottom left entering the scene) -->
    <g transform="translate(140, 425) rotate(-38)">
      <!-- Wheels -->
      <rect x="5" y="-22" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="5" y="15" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="48" y="-22" width="16" height="7" rx="3" fill="#18181b"/>
      <rect x="48" y="15" width="16" height="7" rx="3" fill="#18181b"/>

      <!-- Car body -->
      <rect x="0" y="-18" width="70" height="36" rx="13" fill="#ffffff" stroke="#18181b" stroke-width="5"/>
      <path d="M 46 -14 C 50 -5, 50 5, 46 14" stroke="#18181b" stroke-width="4"/>
      <path d="M 16 -14 C 14 -5, 14 5, 16 14" stroke="#18181b" stroke-width="4"/>
      <rect x="20" y="-12" width="22" height="24" rx="4" fill="#4e7e2c" stroke="#18181b" stroke-width="3.5"/>

      <!-- Tracking Bounding Box -->
      <g transform="translate(-10, -30)">
        <rect x="0" y="0" width="90" height="60" rx="6" stroke="#4e7e2c" stroke-width="4" stroke-dasharray="10 8" fill="#eef7e6" fill-opacity="0.3"/>
        <path d="M 0 14 L 0 0 L 14 0 M 76 0 L 90 0 L 90 14 M 0 46 L 0 60 L 14 60 M 76 60 L 90 60 L 90 46" stroke="#4e7e2c" stroke-width="5"/>
        <circle cx="45" cy="-6" r="4.5" fill="#4e7e2c" stroke="none"/>
      </g>
    </g>

    <!-- Playful sparkles & roadside greenery doodles -->
    <!-- Tree 1 -->
    <ellipse cx="680" cy="380" rx="16" ry="18" fill="#4e7e2c" stroke="#18181b" stroke-width="4"/>
    <path d="M 680 398 L 680 415" stroke="#18181b" stroke-width="4"/>

    <!-- Tree 2 -->
    <ellipse cx="110" cy="280" rx="18" ry="20" fill="#4e7e2c" stroke="#18181b" stroke-width="4"/>
    <path d="M 110 300 L 110 320" stroke="#18181b" stroke-width="4"/>

    <!-- Sparkles -->
    <g transform="translate(680, 50)">
      <path d="M 0 -12 Q 2 -2 12 0 Q 2 2 0 12 Q -2 2 -12 0 Q -2 -2 0 -12 Z" fill="#4e7e2c" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <circle cx="480" cy="80" r="4.5" fill="#4e7e2c" stroke="none"/>
  </g>
</svg>
