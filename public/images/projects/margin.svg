<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Warm cream sketchbook background -->
  <rect width="800" height="500" fill="#faf7f0"/>

  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Grounding shadow doodle -->
    <path d="M 120 425 C 280 435, 520 435, 680 425" stroke="#367e4e" stroke-width="4" stroke-dasharray="12 14" opacity="0.4"/>

    <!-- Large Open University Handbook (Fills central canvas) -->
    <g transform="translate(100, 160)">
      <!-- Hardcover base extending slightly under pages (Strong Green Cloth) -->
      <path d="M 10 240 C 130 255, 270 248, 298 238 L 302 245 C 330 255, 470 255, 590 240 L 595 210 C 475 225, 335 225, 302 215 L 298 215 C 265 225, 125 225, 5 210 Z" fill="#367e4e" stroke-width="5.5"/>

      <!-- Left Page Block -->
      <path d="M 15 205 C 135 220, 265 212, 298 202 L 298 35 C 265 45, 135 48, 20 32 Z" fill="#ffffff" stroke-width="5.5"/>
      <!-- Left Page layer effect -->
      <path d="M 12 215 C 130 228, 260 220, 296 210" stroke-width="4"/>

      <!-- Right Page Block -->
      <path d="M 302 202 C 335 212, 465 220, 585 205 L 580 32 C 465 48, 335 45, 302 35 Z" fill="#ffffff" stroke-width="5.5"/>
      <!-- Right Page layer effect -->
      <path d="M 304 210 C 340 220, 470 228, 588 215" stroke-width="4"/>

      <!-- Center Spine Binding & Ribbon -->
      <path d="M 298 32 C 300 20, 302 20, 304 32 L 304 205 C 302 207, 300 207, 298 205 Z" fill="#18181b"/>
      <!-- Bookmark ribbon curling out the bottom in bold green -->
      <path d="M 301 205 C 305 240, 335 255, 325 285 L 342 278 L 340 286" stroke="#367e4e" stroke-width="6"/>

      <!-- LEFT PAGE: Tiny Hand-Drawn Campus Building Sketch (Playful & lively) -->
      <g transform="translate(65, 55)">
        <!-- Campus Building Ground line -->
        <path d="M 5 125 L 175 125" stroke="#18181b" stroke-width="4"/>
        
        <!-- Main Hall with Archway -->
        <path d="M 35 75 L 35 125 M 145 75 L 145 125 M 35 75 L 145 75" stroke-width="4.5"/>
        <path d="M 72 125 C 72 98, 108 98, 108 125 Z" fill="#367e4e" fill-opacity="0.25" stroke-width="4.5"/>
        
        <!-- Clock / Bell Tower in center (Strong green accents) -->
        <path d="M 70 75 L 70 28 L 110 28 L 110 75" stroke-width="4.5"/>
        <path d="M 64 28 L 90 2 L 116 28 Z" fill="#367e4e" stroke-width="4.5"/>
        <!-- Tower clock face -->
        <circle cx="90" cy="50" r="12" fill="#ffffff" stroke-width="4"/>
        <path d="M 90 50 L 90 43 M 90 50 L 96 50" stroke="#367e4e" stroke-width="3"/>

        <!-- Columns & Windows -->
        <rect x="46" y="85" width="14" height="20" rx="3" fill="#367e4e" stroke-width="3.5"/>
        <rect x="120" y="85" width="14" height="20" rx="3" fill="#367e4e" stroke-width="3.5"/>

        <!-- Quirky trees beside campus building -->
        <path d="M 22 125 L 22 108" stroke-width="4"/>
        <ellipse cx="22" cy="98" rx="14" ry="16" fill="#367e4e" stroke-width="4"/>
        <path d="M 158 125 L 158 108" stroke-width="4"/>
        <ellipse cx="158" cy="98" rx="14" ry="16" fill="#367e4e" stroke-width="4"/>
      </g>

      <!-- RIGHT PAGE: Abstract text lines with prominently grounded green underlined passage -->
      <g transform="translate(340, 55)">
        <path d="M 15 25 L 195 24 M 15 48 L 180 47 M 15 70 L 205 69" stroke="#18181b" stroke-width="3.5"/>
        
        <!-- Highlighted / Underlined Grounded Source Passage (Strong Bold Sage Green) -->
        <!-- Green highlighter backing strip -->
        <rect x="10" y="94" width="200" height="26" rx="4" fill="#367e4e" fill-opacity="0.22" stroke="none"/>
        <path d="M 15 106 L 198 105" stroke="#18181b" stroke-width="4.5"/>
        <!-- Thick, wavy double underline in punchy green -->
        <path d="M 12 124 C 60 120, 140 126, 202 122" stroke="#367e4e" stroke-width="6"/>
        <path d="M 16 132 C 70 128, 130 134, 185 130" stroke="#367e4e" stroke-width="3.5"/>

        <!-- Target anchor pin doodle right next to underlined passage -->
        <circle cx="218" cy="115" r="7" fill="#367e4e" stroke="#18181b" stroke-width="3.5"/>

        <path d="M 15 152 L 185 150 M 15 174 L 140 173" stroke="#18181b" stroke-width="3.5"/>
      </g>
    </g>

    <!-- Thin connecting curved grounding line directly from underline to speech bubble -->
    <path d="M 558 275 C 600 240, 615 170, 560 115 C 530 85, 470 95, 435 90" stroke="#367e4e" stroke-width="4.5" stroke-dasharray="8 6"/>
    <!-- Anchor arrow dot pointing precisely into the passage -->
    <circle cx="558" cy="275" r="5" fill="#367e4e" stroke="#18181b" stroke-width="3"/>

    <!-- Large Floating Hand-Drawn Speech Bubble with Personality -->
    <g transform="translate(230, 20)">
      <!-- Speech bubble body with organic doodle wobble -->
      <path d="M 40 15 C 130 5, 230 10, 255 45 C 275 75, 260 105, 220 115 C 190 122, 160 120, 130 125 L 105 150 L 115 125 C 70 122, 25 110, 15 80 C 5 50, 10 20, 40 15 Z" fill="#ffffff" stroke-width="5.5"/>
      <!-- Inner bold sage green header bar inside bubble -->
      <path d="M 45 42 C 100 38, 170 38, 225 42" stroke="#367e4e" stroke-width="5.5"/>
      
      <!-- Grounded answer doodle content inside bubble -->
      <path d="M 48 65 L 190 63 M 48 85 L 160 83" stroke="#367e4e" stroke-width="4"/>

      <!-- Checkmark badge on speech bubble showing verified grounding -->
      <g transform="translate(225, 25)">
        <circle cx="0" cy="0" r="16" fill="#367e4e" stroke="#18181b" stroke-width="3.5"/>
        <path d="M -7 0 L -2 6 L 8 -5" stroke="#ffffff" stroke-width="4"/>
      </g>
    </g>

    <!-- Sparkles and whimsical atmosphere -->
    <g transform="translate(140, 80)">
      <path d="M 0 -12 Q 2 -2 12 0 Q 2 2 0 12 Q -2 2 -12 0 Q -2 -2 0 -12 Z" fill="#367e4e" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <g transform="translate(680, 150)">
      <path d="M 0 -10 Q 2 -2 10 0 Q 2 2 0 10 Q -2 2 -10 0 Q -2 -2 0 -10 Z" fill="#367e4e" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <circle cx="215" cy="115" r="4" fill="#367e4e" stroke="none"/>
    <circle cx="670" cy="330" r="4.5" fill="#367e4e" stroke="none"/>
  </g>
</svg>
