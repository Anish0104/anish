<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Warm cream sketchbook background -->
  <rect width="800" height="500" fill="#faf7f0"/>

  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Grounding loose shadow -->
    <path d="M 80 435 C 280 440, 520 440, 720 435" stroke="#316ebd" stroke-width="4.5" stroke-dasharray="14 16" opacity="0.35"/>

    <!-- Document Folder & Overlapping Sheets at Base -->
    <g transform="translate(110, 180)">
      <!-- Back flap of manila/folder with tab in rich slate blue -->
      <path d="M 20 230 L 15 60 L 95 60 L 125 90 L 330 90 L 335 230 Z" fill="#ffffff" stroke-width="5.5"/>
      <!-- Folder tab accent in bold slate blue -->
      <path d="M 15 60 L 95 60 L 125 90 L 15 90 Z" fill="#316ebd" stroke="#18181b" stroke-width="4.5"/>

      <!-- Overlapping Sheet 1 (Tilted left, abstract ink lines) -->
      <g transform="translate(45, 40) rotate(-7)">
        <polygon points="0,0 170,-5 175,170 5,175" fill="#ffffff" stroke="#18181b" stroke-width="5"/>
        <path d="M 22 25 L 140 22 M 22 45 L 120 42 M 22 65 L 150 62" stroke="#18181b" stroke-width="3.5"/>
      </g>

      <!-- Overlapping Sheet 2 (Tilted right with prominent highlighted source passage) -->
      <g transform="translate(90, 20) rotate(5)">
        <polygon points="0,0 190,-4 195,190 5,194" fill="#ffffff" stroke="#18181b" stroke-width="5.5"/>
        <!-- Abstract text strokes -->
        <path d="M 25 30 L 165 27 M 25 55 L 145 52" stroke="#18181b" stroke-width="3.5"/>

        <!-- The Highlighted Source Passage (Strong Slate Blue) -->
        <rect x="20" y="75" width="160" height="26" rx="4" fill="#316ebd" fill-opacity="0.25" stroke="none"/>
        <path d="M 25 88 L 168 86" stroke="#18181b" stroke-width="4.5"/>
        <path d="M 22 104 C 65 102, 120 106, 172 102" stroke="#316ebd" stroke-width="6"/>

        <!-- Source anchor pin doodle -->
        <circle cx="186" cy="88" r="7" fill="#316ebd" stroke="#18181b" stroke-width="3.5"/>

        <path d="M 25 125 L 150 122 M 25 145 L 110 142" stroke="#18181b" stroke-width="3.5"/>
      </g>

      <!-- Front flap of folder holding pages together -->
      <path d="M 10 230 C 90 235, 230 232, 335 230 L 330 140 C 230 145, 120 135, 15 148 Z" fill="#e8f1fc" stroke="#316ebd" stroke-width="5"/>
      <path d="M 10 230 C 90 235, 230 232, 335 230 L 330 140 C 230 145, 120 135, 15 148 Z" stroke="#18181b" stroke-width="5.5"/>
    </g>

    <!-- Whimsical Dotted Flight Path (Loop-de-loop connecting highlighted passage to airplane) -->
    <!-- Starting exactly at the source anchor on the page (x: 375, y: 285) -->
    <path d="M 380 280 C 460 250, 480 340, 410 370 C 340 395, 330 300, 390 220 C 450 150, 480 180, 520 140" stroke="#316ebd" stroke-width="4.5" stroke-dasharray="8 8"/>
    <!-- Small flight path arrows -->
    <path d="M 425 210 L 442 205 L 436 220" stroke="#316ebd" stroke-width="3.5"/>

    <!-- Large Hand-Drawn Paper Airplane (Main Focal Point, Soaring High Right) -->
    <g transform="translate(520, 80) rotate(-16)">
      <!-- Motion wind swooshes around wings -->
      <path d="M -40 -15 C -20 -20, 10 -25, 40 -20" stroke="#316ebd" stroke-width="3.5" stroke-dasharray="6 6"/>
      <path d="M -60 45 C -30 50, 0 52, 30 45" stroke="#316ebd" stroke-width="3.5" stroke-dasharray="6 6"/>

      <!-- Airplane Left Wing (Underside shaded in bold slate blue) -->
      <polygon points="170,0 0,60 70,30" fill="#316ebd" stroke="#18181b" stroke-width="6"/>
      
      <!-- Airplane Center Fold & Keel -->
      <polygon points="170,0 70,30 55,75" fill="#e8f1fc" stroke="#18181b" stroke-width="5.5"/>

      <!-- Airplane Right Wing (Top visible wing) -->
      <polygon points="170,0 20,-45 70,30" fill="#ffffff" stroke="#18181b" stroke-width="6"/>
      <!-- Wing crease highlight stripe in slate blue -->
      <path d="M 140 2 L 40 -25" stroke="#316ebd" stroke-width="5"/>

      <!-- Trailing speed sparks at the nose and wingtips -->
      <g transform="translate(195, 0)">
        <path d="M 0 -12 Q 2 -2 12 0 Q 2 2 0 12 Q -2 2 -12 0 Q -2 -2 0 -12 Z" fill="#316ebd" stroke="#18181b" stroke-width="2.5"/>
      </g>
      <circle cx="215" cy="-2" r="3.5" fill="#316ebd" stroke="none"/>
    </g>

    <!-- Playful doodle accents & stars -->
    <g transform="translate(680, 240)">
      <path d="M 0 -10 Q 2 -2 10 0 Q 2 2 0 10 Q -2 2 -10 0 Q -2 -2 0 -10 Z" fill="#316ebd" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <circle cx="180" cy="110" r="4.5" fill="#316ebd" stroke="none"/>
    <circle cx="690" cy="380" r="4" fill="#316ebd" stroke="none"/>
  </g>
</svg>
