<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Warm cream sketchbook background -->
  <rect width="800" height="500" fill="#faf7f0"/>

  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ground line with doodle shadow -->
    <path d="M 100 410 C 300 415, 520 415, 710 410" stroke="#7c5cbf" stroke-width="4.5" stroke-dasharray="14 16" opacity="0.35"/>

    <!-- Background Door 2 (Closed with Lock - Access restricted, muted lavender trim) -->
    <g transform="translate(140, 150)">
      <!-- Door frame -->
      <path d="M 0 250 L 0 50 C 0 10, 40 -10, 85 -10 C 130 -10, 170 10, 170 50 L 170 250" stroke="#18181b" stroke-width="5" stroke-dasharray="10 8"/>
      <!-- Inner door panel -->
      <path d="M 14 250 L 14 55 C 14 20, 50 5, 85 5 C 120 5, 156 20, 156 55 L 156 250" fill="#f4effa" stroke="#7c5cbf" stroke-width="4" opacity="0.7"/>
      <!-- Closed door padlock doodle -->
      <rect x="70" y="115" width="30" height="26" rx="5" fill="#7c5cbf" stroke="#18181b" stroke-width="4"/>
      <path d="M 77 115 L 77 100 C 77 90, 93 90, 93 100 L 93 115" stroke="#18181b" stroke-width="4"/>
      <circle cx="85" cy="128" r="3" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Foreground Open Doorway (Human hand reaches through) -->
    <g transform="translate(350, 110)">
      <!-- Sturdy Arched Door Frame -->
      <path d="M 0 290 L 0 60 C 0 10, 45 -15, 100 -15 C 155 -15, 200 10, 200 60 L 200 290" fill="#ffffff" stroke-width="6"/>
      <!-- Door jamb depth line -->
      <path d="M 15 290 L 15 65 C 15 25, 55 5, 100 5 C 145 5, 185 25, 185 65 L 185 290" fill="#f4effa" stroke="#7c5cbf" stroke-width="4"/>
      
      <!-- Open door ajar swung outward -->
      <path d="M 0 60 L -45 80 L -45 300 L 0 290 Z" fill="#ffffff" stroke-width="5"/>
      <circle cx="-35" cy="190" r="5" fill="#7c5cbf" stroke="#18181b" stroke-width="3.5"/>

      <!-- Friendly Human Hand reaching through the portal offering key -->
      <g transform="translate(80, 140)">
        <!-- Sleeve with bold purple cuff -->
        <path d="M 0 20 L 45 15 L 48 60 L 2 62 Z" fill="#7c5cbf" stroke-width="5"/>
        <!-- Arm & Wrist -->
        <path d="M 45 22 C 75 22, 105 24, 130 35 C 145 42, 145 55, 125 58 C 100 60, 75 58, 48 58" fill="#ffffff" stroke-width="5"/>
        <!-- Fingers holding the key ring -->
        <path d="M 125 35 C 138 32, 150 36, 150 45 C 150 54, 135 56, 122 55" stroke-width="4.5"/>
        <path d="M 122 42 C 132 40, 142 42, 142 48" stroke-width="4"/>
      </g>
    </g>

    <!-- The Old-Fashioned Key & Permission Tag (Vibrant Lavender Accent) -->
    <g transform="translate(500, 175) rotate(-8)">
      <!-- Key loop & shaft -->
      <ellipse cx="20" cy="20" rx="18" ry="16" fill="#7c5cbf" stroke-width="5.5"/>
      <ellipse cx="20" cy="20" rx="7" ry="6" fill="#ffffff" stroke-width="4"/>
      <!-- Key shaft -->
      <path d="M 38 20 L 98 20" stroke="#7c5cbf" stroke-width="8"/>
      <path d="M 38 20 L 98 20" stroke="#18181b" stroke-width="5"/>
      <!-- Key teeth -->
      <path d="M 82 20 L 82 36 M 94 20 L 94 38 M 94 28 L 86 28" stroke="#18181b" stroke-width="5"/>

      <!-- Dangling Permission Tag (fluttering with playful movement) -->
      <g transform="translate(18, 38) rotate(10)">
        <path d="M 0 0 L 8 14" stroke="#7c5cbf" stroke-width="3.5" stroke-dasharray="4 3"/>
        <!-- Tag body -->
        <path d="M -15 14 L 35 14 L 42 55 L -10 55 Z" fill="#7c5cbf" stroke-width="4.5"/>
        <circle cx="10" cy="22" r="3" fill="#ffffff" stroke="none"/>
        <!-- Bright White Checkmark on tag -->
        <path d="M -2 36 L 8 46 L 28 26" stroke="#ffffff" stroke-width="5"/>
      </g>
      
      <!-- Key sparkle effects -->
      <g transform="translate(110, 10)">
        <path d="M 0 -8 Q 1 -1 8 0 Q 1 1 0 8 Q -1 1 -8 0 Q -1 -1 0 -8 Z" fill="#7c5cbf" stroke="#18181b" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Charming Minimal Robot (Receiving key with playful, eager posture) -->
    <g transform="translate(565, 205)">
      <!-- Antenna with quirky zig-zag spring & pulse bead -->
      <path d="M 65 -5 C 65 -25, 75 -35, 60 -50" stroke="#18181b" stroke-width="4.5"/>
      <circle cx="60" cy="-56" r="12" fill="#7c5cbf" stroke-width="4.5"/>
      <!-- Antenna signal arcs -->
      <path d="M 42 -66 C 52 -78, 70 -78, 80 -66" stroke="#7c5cbf" stroke-width="3"/>
      <path d="M 36 -74 C 52 -90, 76 -90, 90 -74" stroke="#7c5cbf" stroke-width="2.5"/>

      <!-- Head (Tilted curiously, rounded rectangular with personality) -->
      <rect x="15" y="-5" width="105" height="75" rx="24" fill="#ffffff" stroke-width="5.5"/>
      <!-- Cute Visor / Screen band in bold lavender -->
      <rect x="25" y="10" width="85" height="32" rx="14" fill="#7c5cbf" stroke-width="4"/>
      <!-- Big friendly doodle eyes looking up toward key -->
      <circle cx="50" cy="26" r="8" fill="#ffffff" stroke="none"/>
      <circle cx="53" cy="26" r="4" fill="#18181b" stroke="none"/>
      <circle cx="82" cy="26" r="8" fill="#ffffff" stroke="none"/>
      <circle cx="85" cy="26" r="4" fill="#18181b" stroke="none"/>
      <!-- Happy little smile -->
      <path d="M 55 56 Q 68 66 80 56" stroke="#18181b" stroke-width="4"/>

      <!-- Neck joint -->
      <rect x="55" y="70" width="25" height="12" rx="3" fill="#7c5cbf" stroke-width="3.5"/>

      <!-- Body / Chassis with rounded corners -->
      <rect x="22" y="82" width="90" height="90" rx="20" fill="#ffffff" stroke-width="5.5"/>
      <!-- Chest belly gauge / meter in bold lavender -->
      <rect x="38" y="98" width="58" height="40" rx="10" fill="#f4effa" stroke="#7c5cbf" stroke-width="4"/>
      <!-- Heartbeat / access status pulse -->
      <path d="M 48 118 L 56 118 L 62 106 L 70 128 L 76 118 L 86 118" stroke="#7c5cbf" stroke-width="4"/>

      <!-- Eager little arms reaching left to receive the key -->
      <path d="M 22 105 C -5 95, -25 80, -35 55" stroke-width="5"/>
      <!-- Hand clasping -->
      <ellipse cx="-38" cy="52" rx="9" ry="7" fill="#7c5cbf" stroke-width="4"/>
      <path d="M -44 48 C -48 55, -42 62, -32 60" stroke-width="4"/>

      <!-- Other arm resting happily -->
      <path d="M 112 110 C 130 125, 130 145, 120 155" stroke-width="4.5"/>
      <circle cx="120" cy="155" r="7" fill="#7c5cbf" stroke-width="3.5"/>

      <!-- Cute wheel/track base with motion doodle lines -->
      <rect x="30" y="172" width="75" height="25" rx="12" fill="#7c5cbf" stroke-width="4.5"/>
      <circle cx="48" cy="184" r="6" fill="#ffffff" stroke-width="3"/>
      <circle cx="86" cy="184" r="6" fill="#ffffff" stroke-width="3"/>
      <!-- Ground shadow under robot -->
      <ellipse cx="68" cy="205" rx="45" ry="6" fill="#18181b" opacity="0.15" stroke="none"/>
    </g>

    <!-- Whimsical doodles & sparkles -->
    <g transform="translate(680, 110)">
      <path d="M 0 -12 Q 2 -2 12 0 Q 2 2 0 12 Q -2 2 -12 0 Q -2 -2 0 -12 Z" fill="#7c5cbf" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <circle cx="460" cy="110" r="4.5" fill="#7c5cbf" stroke="none"/>
    <circle cx="730" cy="310" r="4" fill="#7c5cbf" stroke="none"/>
  </g>
</svg>
