<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Warm cream sketchbook background -->
  <rect width="800" height="500" fill="#faf7f0"/>

  <g stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Grounding base line -->
    <path d="M 80 435 C 280 440, 520 440, 720 435" stroke="#1e8282" stroke-width="4.5" stroke-dasharray="14 16" opacity="0.35"/>

    <!-- Background: Modest Hand-Drawn Market Trend Chart with Energetic Swings -->
    <g transform="translate(140, 85)">
      <!-- Chart axis box lines (Abstract, playful) -->
      <path d="M 0 160 L 520 160" stroke="#18181b" stroke-width="4" stroke-dasharray="10 10"/>
      <path d="M 0 0 L 0 160" stroke="#18181b" stroke-width="4"/>

      <!-- Undulating market uncertainty wave line (Bold Dusty Teal) -->
      <path d="M 0 110 C 60 70, 100 145, 160 80 C 210 25, 270 135, 340 70 C 400 15, 450 90, 510 35" stroke="#1e8282" stroke-width="5.5"/>

      <!-- Market milestone data nodes in teal -->
      <circle cx="160" cy="80" r="7" fill="#1e8282" stroke="#18181b" stroke-width="3.5"/>
      <circle cx="270" cy="135" r="7" fill="#ffffff" stroke="#1e8282" stroke-width="3.5"/>
      <circle cx="340" cy="70" r="7" fill="#1e8282" stroke="#18181b" stroke-width="3.5"/>
      <circle cx="510" cy="35" r="9" fill="#1e8282" stroke="#18181b" stroke-width="4"/>
      
      <!-- Sparkle above peak -->
      <g transform="translate(510, 10)">
        <path d="M 0 -8 Q 1 -1 8 0 Q 1 1 0 8 Q -1 1 -8 0 Q -1 -1 0 -8 Z" fill="#1e8282" stroke="#18181b" stroke-width="2.5"/>
      </g>
    </g>

    <!-- The Seesaw Mechanism (Foreground, tilted with personality) -->
    <g transform="translate(180, 310)">
      <!-- Seesaw Plank / Lever (Tilted slightly counter-clockwise) -->
      <g transform="rotate(-7 220 50)">
        <polygon points="10,42 430,42 430,58 10,58" fill="#ffffff" stroke="#18181b" stroke-width="6"/>
        <!-- Teal runner strip along lever -->
        <path d="M 20 50 L 420 50" stroke="#1e8282" stroke-width="4"/>

        <!-- LEFT PLATFORM: Stack of 5 Coins (Taller, heavier side) -->
        <g transform="translate(45, -35)">
          <!-- Coin 5 (bottom) -->
          <ellipse cx="30" cy="70" rx="30" ry="10" fill="#1e8282" stroke="#18181b" stroke-width="4.5"/>
          <!-- Coin 4 -->
          <ellipse cx="30" cy="54" rx="30" ry="10" fill="#ffffff" stroke="#18181b" stroke-width="4.5"/>
          <!-- Coin 3 -->
          <ellipse cx="30" cy="38" rx="30" ry="10" fill="#1e8282" stroke="#18181b" stroke-width="4.5"/>
          <!-- Coin 2 -->
          <ellipse cx="30" cy="22" rx="30" ry="10" fill="#ffffff" stroke="#18181b" stroke-width="4.5"/>
          <!-- Coin 1 (top, slightly tilted) -->
          <ellipse cx="32" cy="6" rx="30" ry="10" fill="#e4f2f2" stroke="#1e8282" stroke-width="5"/>
          <!-- Coin rim accents -->
          <ellipse cx="32" cy="6" rx="18" ry="6" stroke="#1e8282" stroke-width="3"/>
        </g>

        <!-- RIGHT PLATFORM: Stack of 2 Coins (Lighter side being calibrated) -->
        <g transform="translate(330, 10)">
          <!-- Coin 2 (bottom) -->
          <ellipse cx="30" cy="32" rx="30" ry="10" fill="#ffffff" stroke="#18181b" stroke-width="4.5"/>
          <!-- Coin 1 (top) -->
          <ellipse cx="30" cy="16" rx="30" ry="10" fill="#1e8282" stroke="#18181b" stroke-width="4.5"/>
          <ellipse cx="30" cy="16" rx="18" ry="6" stroke="#ffffff" stroke-width="3"/>
          <!-- Little weight adjustment indicator -->
          <path d="M 30 -5 L 30 5" stroke="#1e8282" stroke-width="3.5"/>
        </g>
      </g>

      <!-- Central Fulcrum / Pivot (Sturdy Hand-Drawn Triangle) -->
      <polygon points="220,40 180,120 260,120" fill="#1e8282" stroke="#18181b" stroke-width="6"/>
      <!-- Fulcrum pivot pin ring -->
      <circle cx="220" cy="50" r="9" fill="#ffffff" stroke="#18181b" stroke-width="4.5"/>
      <circle cx="220" cy="50" r="4" fill="#1e8282" stroke="none"/>
    </g>

    <!-- Thoughtful Little Robot (Adjusting the seesaw with curiosity and care) -->
    <g transform="translate(350, 180)">
      <!-- Robot antenna with spiral wobble & teal sphere -->
      <path d="M 50 -10 C 50 -25, 40 -35, 55 -45" stroke="#18181b" stroke-width="4.5"/>
      <circle cx="55" cy="-50" r="11" fill="#1e8282" stroke="#18181b" stroke-width="4"/>
      <!-- Questioning thought pulse ring -->
      <path d="M 38 -58 C 48 -68, 65 -68, 75 -58" stroke="#1e8282" stroke-width="3"/>

      <!-- Robot Head (Tilted curiously at seesaw) -->
      <rect x="5" y="-10" width="95" height="70" rx="22" fill="#ffffff" stroke="#18181b" stroke-width="5.5"/>
      
      <!-- Big Single Monocle / Analysis Lens in Teal -->
      <circle cx="45" cy="22" r="18" fill="#1e8282" stroke="#18181b" stroke-width="4.5"/>
      <circle cx="45" cy="22" r="10" fill="#ffffff" stroke="none"/>
      <circle cx="48" cy="20" r="5" fill="#18181b" stroke="none"/>
      <!-- Small secondary sensor eye -->
      <circle cx="75" cy="22" r="6" fill="#18181b" stroke="none"/>

      <!-- Thoughtful / curious mouth (pensive line) -->
      <path d="M 38 46 L 68 44" stroke="#18181b" stroke-width="4"/>

      <!-- Robot Torso / Body -->
      <rect x="15" y="70" width="80" height="78" rx="18" fill="#ffffff" stroke="#18181b" stroke-width="5.5"/>
      <!-- Chest tuning dial in teal -->
      <circle cx="55" cy="105" r="18" fill="#e4f2f2" stroke="#1e8282" stroke-width="4"/>
      <path d="M 55 105 L 64 96" stroke="#1e8282" stroke-width="4"/>
      <circle cx="55" cy="105" r="4" fill="#1e8282" stroke="none"/>

      <!-- Arm 1: Reaching down carefully adjusting the pivot balance slider -->
      <path d="M 20 85 C 0 95, -5 130, 20 160" stroke="#18181b" stroke-width="5"/>
      <circle cx="22" cy="162" r="8" fill="#1e8282" stroke="#18181b" stroke-width="3.5"/>

      <!-- Arm 2: Hand scratching chin thoughtfully -->
      <path d="M 90 90 C 110 85, 110 60, 95 48" stroke="#18181b" stroke-width="5"/>
      <circle cx="95" cy="46" r="7" fill="#1e8282" stroke="#18181b" stroke-width="3.5"/>

      <!-- Little legs resting on ground -->
      <rect x="30" y="148" width="16" height="28" rx="6" fill="#1e8282" stroke="#18181b" stroke-width="4"/>
      <rect x="62" y="148" width="16" height="28" rx="6" fill="#1e8282" stroke="#18181b" stroke-width="4"/>
    </g>

    <!-- Balance wobble movement marks around seesaw -->
    <path d="M 210 270 C 200 280, 200 290, 210 300" stroke="#1e8282" stroke-width="3"/>
    <path d="M 590 320 C 600 330, 600 340, 590 350" stroke="#1e8282" stroke-width="3"/>

    <!-- Sparkles and doodles -->
    <g transform="translate(680, 160)">
      <path d="M 0 -12 Q 2 -2 12 0 Q 2 2 0 12 Q -2 2 -12 0 Q -2 -2 0 -12 Z" fill="#1e8282" stroke="#18181b" stroke-width="2.5"/>
    </g>
    <circle cx="130" cy="100" r="4.5" fill="#1e8282" stroke="none"/>
  </g>
</svg>
