<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Terminal Glow Filter -->
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-glow)">
    <!-- Textured Wavy Curly Hair -->
    <path d="M60 90 C50 75 52 50 70 38 C80 30 95 32 105 28 C115 22 135 22 145 28 C158 30 172 32 180 42 C192 56 190 75 182 90" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M68 65 C62 50 75 40 85 45 C95 38 110 36 120 40 C135 35 150 40 160 46 C172 44 180 55 174 70" stroke="#38bdf8" stroke-width="1.6" opacity="0.8" />
    <path d="M80 50 C90 42 108 44 116 52 C126 44 142 46 152 54" stroke="#38bdf8" stroke-width="1.4" opacity="0.6" />
    <path d="M62 85 C56 95 58 110 65 118" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M180 85 C186 95 184 110 177 118" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Head Outline & Ears -->
    <!-- Left Ear -->
    <path d="M65 110 C58 112 56 122 62 130 C65 134 68 132 70 128" stroke="#22d3ee" stroke-width="1.8" />
    <!-- Right Ear -->
    <path d="M177 110 C184 112 186 122 180 130 C177 134 174 132 172 128" stroke="#22d3ee" stroke-width="1.8" />

    <!-- Face Contour (Cheeks to Chin) -->
    <path d="M68 112 C68 135 72 165 95 188 C105 198 135 198 145 188 C168 165 172 135 172 112" stroke="#22d3ee" stroke-width="2" />

    <!-- Eyebrows -->
    <path d="M80 96 C88 92 100 93 108 97" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M134 97 C142 93 154 92 162 96" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Spectacles / Glasses (Thick Frames with Bridge) -->
    <!-- Left Frame -->
    <rect x="76" y="103" width="34" height="25" rx="6" stroke="#22d3ee" stroke-width="2.6" fill="#0e2338" fill-opacity="0.3" />
    <!-- Right Frame -->
    <rect x="132" y="103" width="34" height="25" rx="6" stroke="#22d3ee" stroke-width="2.6" fill="#0e2338" fill-opacity="0.3" />
    <!-- Bridge -->
    <path d="M110 114 C116 111 126 111 132 114" stroke="#22d3ee" stroke-width="2.6" />
    <!-- Temples / Arms -->
    <path d="M76 112 L65 110" stroke="#22d3ee" stroke-width="2" />
    <path d="M166 112 L177 110" stroke="#22d3ee" stroke-width="2" />

    <!-- Eyes (Behind Glasses) -->
    <ellipse cx="93" cy="115" rx="3.5" ry="3.5" fill="#38bdf8" stroke="none" />
    <ellipse cx="149" cy="115" rx="3.5" ry="3.5" fill="#38bdf8" stroke="none" />
    <circle cx="94.5" cy="113.5" r="1" fill="#ffffff" stroke="none" />
    <circle cx="150.5" cy="113.5" r="1" fill="#ffffff" stroke="none" />

    <!-- Nose -->
    <path d="M117 118 L116 135 C116 140 125 141 127 137" stroke="#22d3ee" stroke-width="1.8" />

    <!-- Connected Moustache -->
    <path d="M102 147 C110 144 116 148 120 150 C124 148 130 144 138 147 C144 150 142 157 135 158 C128 159 123 154 120 154 C117 154 112 159 105 158 C98 157 96 150 102 147 Z" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1.8" />

    <!-- Mouth -->
    <path d="M110 162 C115 165 125 165 130 162" stroke="#22d3ee" stroke-width="1.6" />

    <!-- Short Full Beard (Cheeks, Jawline & Chin) -->
    <path d="M70 128 C70 150 78 172 100 188 C108 194 132 194 140 188 C162 172 170 150 170 128 C166 145 155 165 140 174 C132 179 108 179 100 174 C85 165 74 145 70 128 Z" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.8" />
    <path d="M112 174 C116 177 124 177 128 174" stroke="#22d3ee" stroke-width="1.5" />

    <!-- Neck & Collar Outline -->
    <path d="M96 195 L90 220" stroke="#22d3ee" stroke-width="2" />
    <path d="M144 195 L150 220" stroke="#22d3ee" stroke-width="2" />
    <path d="M90 216 C105 224 135 224 150 216" stroke="#22d3ee" stroke-width="2" />
  </g>
</svg>
